  <text x="600" y="190" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="84" font-weight="800" letter-spacing="8" fill="#ffffff">HELLO WORLD</text>
  <text x="600" y="237" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="21" letter-spacing="5" fill="#f5d0fe">WELCOME TO MY PROFILE</text>

  <g fill="none" stroke="#f5d0fe" stroke-opacity="0.6" stroke-width="1.5">
    <path d="M110 280 L140 240 L190 240 L160 280 Z"/>
    <path d="M170 280 L200 240 L250 240 L220 280 Z"/>
    <path d="M1090 280 L1060 240 L1010 240 L1040 280 Z"/>
    <path d="M1030 280 L1000 240 L950 240 L980 280 Z"/>
