<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Hello World - Welcome to my profile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0a4a"/>
      <stop offset="0.55" stop-color="#4b1170"/>
      <stop offset="1" stop-color="#1c0836"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#d946ef" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
