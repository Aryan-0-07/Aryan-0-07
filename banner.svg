    <circle cx="1070" cy="70" r="4"/><circle cx="1010" cy="115" r="3"/><circle cx="1110" cy="130" r="2.5"/>
  </g>

  <circle cx="600" cy="75" r="46" fill="#1e1b2e" stroke="url(#ring)" stroke-width="4"/>
